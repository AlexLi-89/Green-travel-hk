<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠色足跡平台 - 人流稀疏景點推薦</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-leaf"></i> 綠色足跡平台</h1>
            <p class="tagline">探索香港綠色景點，基於政府開放數據</p>
            <div class="controls">
                <button class="btn active" id="btn-all">
                    <i class="fas fa-list"></i> 所有景點
                </button>
                <button class="btn" id="btn-sparse">
                    <i class="fas fa-tree"></i> 綠色景點
                </button>
                <button class="btn" id="btn-crowded">
                    <i class="fas fa-users"></i> 熱門景點
                </button>
                <button class="btn btn-outline" id="btn-refresh">
                    <i class="fas fa-sync-alt"></i> 更新數據
                </button>
            </div>
        </header>
        
        <!-- 今日推薦 - 移到最上方 -->
        <div class="recommendation-top">
            <h3><i class="fas fa-lightbulb"></i> 今日推薦</h3>
            <p>根據政府開放數據，<strong id="recommended-location">香港公園</strong> 是今日推薦景點。</p>
        </div>
        
        <div class="main-content">
            <div class="card">
                <h2><i class="fas fa-map-marker-alt"></i> 景點列表</h2>
                <ul class="location-list" id="location-list">
                    <!-- 景點將通過JS動態生成 -->
                </ul>
            </div>
            
            <div class="card">
                <h2><i class="fas fa-info-circle"></i> 景點詳情</h2>
                <div id="location-detail">
                    <p>選擇左側景點查看詳細信息</p>
                </div>
                
                <div class="weather-info" id="weather-info">
                    <p>天氣信息暫無數據</p>
                </div>
                
                <div class="traffic-info" id="traffic-info">
                    <p>交通信息暫無數據</p>
                </div>
                
                <div class="map-placeholder">
                    <i class="fas fa-map-marked-alt"></i> 地圖視圖 (整合開放數據後顯示)
                </div>
            </div>
        </div>
        
        <footer>
            <p>綠色足跡平台 - 2025 Hackathon 參賽作品</p>
            <p class="data-source">數據來源: data.gov.hk 及 portal.csdi.gov.hk</p>
        </footer>
    </div>

    <!-- 只加載主腳本文件 -->
    <script src="scripts/script.js"></script>
</body>
</html>
